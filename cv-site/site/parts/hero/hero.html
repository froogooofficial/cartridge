<section id="hero" class="hero section wrap" aria-labelledby="hero-title" data-stagger="72">
  <h1 class="hero-title" id="hero-title">
    <span class="eyebrow hero-kicker">{{person.name}}<span class="hero-sep" aria-hidden="true">·</span><span class="dim">{{person.location}}</span></span>
    <span class="hero-display">{{person.tagline}}</span>
  </h1>

  <p class="hero-lede reveal"><span class="hero-role">{{person.title}}.</span> {{person.summary}}</p>

  <!-- Only the primary action. The secondary links (LinkedIn / GitHub / Résumé)
       used to be rendered here too, and the contact section renders the exact
       same three again as 48px rows — the same content twice on one page. The
       close owns the full link set; the hero keeps its one idea. -->
  <div class="hero-actions reveal">
    {{#each person.links}}{{#if @first}}<a class="hero-cta tap" href="{{href}}">{{label}}</a>{{/if}}{{/each}}
  </div>
</section>
