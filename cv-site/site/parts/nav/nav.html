<!-- Persistent bottom dock. Fixed, safe-area aware, 4 destinations + 1 primary action. -->
<div class="dock-shell">
  <nav class="dock" aria-label="Section navigation">
    <h2 class="dock-hd">Sections</h2>

    <ul class="dock-tabs">
      <li class="dock-slot">
        <a class="tap dock-tab" href="#work" data-spy>
          <svg class="dock-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <rect x="3.25" y="3.25" width="7.5" height="7.5" rx="2.2"/>
            <rect x="13.25" y="3.25" width="7.5" height="7.5" rx="2.2"/>
            <rect x="3.25" y="13.25" width="7.5" height="7.5" rx="2.2"/>
            <rect x="13.25" y="13.25" width="7.5" height="7.5" rx="2.2"/>
          </svg>
          <span class="dock-lb">Work</span>
        </a>
      </li>

      <li class="dock-slot">
        <a class="tap dock-tab" href="#experience" data-spy>
          <svg class="dock-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <rect x="2.75" y="6.75" width="18.5" height="14" rx="2.6"/>
            <path d="M8.75 6.75V5.5A1.75 1.75 0 0 1 10.5 3.75h3A1.75 1.75 0 0 1 15.25 5.5v1.25"/>
            <path d="M2.75 12.25h18.5"/>
          </svg>
          <span class="dock-lb">Career</span>
        </a>
      </li>

      <li class="dock-slot">
        <a class="tap dock-tab" href="#skills" data-spy>
          <svg class="dock-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M5 20v-5.5"/>
            <path d="M12 20V4"/>
            <path d="M19 20v-9"/>
          </svg>
          <span class="dock-lb">Skills</span>
        </a>
      </li>

      <li class="dock-slot">
        <a class="tap dock-tab" href="#contact" data-spy>
          <svg class="dock-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M20.75 11.6a8.35 8.35 0 0 1-12.1 7.45L3.6 20.4l1.4-4.9A8.35 8.35 0 1 1 20.75 11.6Z"/>
          </svg>
          <span class="dock-lb">Contact</span>
        </a>
      </li>
    </ul>

    <a class="tap dock-cta" href="mailto:{{person.email}}" aria-label="Email {{person.name}}">
      <svg class="dock-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <rect x="2.75" y="4.75" width="18.5" height="14.5" rx="2.6"/>
        <path d="m3.6 7.4 7.35 5.1a1.85 1.85 0 0 0 2.1 0l7.35-5.1"/>
      </svg>
    </a>
  </nav>
</div>
